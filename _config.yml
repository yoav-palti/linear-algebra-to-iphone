# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: Linear Algebra to iPhone 1
author: Yoav Palti
logo: logo.png

# Keep local dependencies and editor metadata out of the book build.
exclude_patterns: [_build, .venv, .git, .idea, .obsidian, myst-reader, Thumbs.db, .DS_Store, "**.ipynb_checkpoints"]

# Publish course chapters only; keep drafts and maintenance notes out of the site.
only_build_toc_files: true

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: force

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: linear_algebra_to_iphone.tex

# Information about where the book exists on the web
repository:
  url: https://github.com/yoav-palti/linear-algebra-to-iphone  # Online location of your book
  branch: main  # Which branch of the repository should be used when creating links (optional)

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  use_repository_button: true

sphinx:
  local_extensions:
    course_assets: _ext
  config:
    html_context:
      default_mode: auto
    suppress_warnings:
      - myst.header
    # Use SVG by default so math accents render consistently on new devices.
    mathjax_path: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-svg.js
    mathjax3_config:
      options:
        menuOptions:
          settings:
            renderer: SVG
