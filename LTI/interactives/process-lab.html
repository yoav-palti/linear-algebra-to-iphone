<style>
  .process-lab [hidden] { display:none !important; }
  .process-lab .pl-diagram { direction:ltr; overflow-x:auto; background:white; border:1px solid #dce5eb; border-radius:12px; margin:12px 0; }
  .process-lab .pl-canvas { position:relative; min-width:620px; }
  .process-lab .pl-canvas > svg { display:block; width:100%; height:auto; }
  .process-lab .pl-label { position:absolute; transform:translate(-50%,-50%); background:transparent; font-size:13px; white-space:nowrap; pointer-events:none; }
  .process-lab .pl-part { cursor:pointer; outline:none; }
  .process-lab .pl-body { stroke:var(--signal); fill:white; stroke-width:2; }
  .process-lab .pl-part:hover .pl-body,.process-lab .pl-part[aria-pressed=true] .pl-body { fill:var(--tint); stroke-width:3; }
  .process-lab .pl-part:focus-visible .pl-body { stroke-width:4; stroke-dasharray:4 2; }
  .process-lab .pl-probe[aria-pressed=true] .pl-body { fill:var(--signal); }
  .process-lab .pl-symbol { stroke:var(--signal); stroke-width:2; fill:none; pointer-events:none; }
  .process-lab .pl-part text { fill:var(--signal); font:15px system-ui,sans-serif; text-anchor:middle; pointer-events:none; }
  .process-lab .pl-wire { fill:none; stroke-width:2; }
  .process-lab .pl-equation { direction:ltr; display:flex; flex-wrap:wrap; justify-content:center; gap:6px 12px; margin:10px 0; overflow:visible; }
  .process-lab .pl-equation > span { max-width:100%; }
  .process-lab .pl-equation .pl-row { width:100%; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:6px 10px; }
  .process-lab .pl-description { margin:8px 0; min-height:2em; }
  .process-lab .pl-legend,.process-lab .pl-audio { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:10px 0; }
  .process-lab .pl-legend button { display:flex; align-items:center; gap:8px; color:var(--signal); border-color:var(--signal); background:var(--tint); }
  .process-lab .pl-legend button::before { content:""; width:20px; height:3px; background:var(--signal); }
  .process-lab .pl-legend button[aria-pressed=false] { text-decoration:line-through; background:white; opacity:.65; }
  .process-lab .pl-parameters { border:1px solid #dce5eb; border-radius:10px; padding:0 10px; margin:10px 0 12px; }
  .process-lab .pl-parameters > summary { cursor:pointer; padding:8px 2px; font-weight:650; }
  .process-lab .pl-parameters > summary:focus-visible { outline:3px solid #168c9a; }
  .process-lab .ci-controls { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .process-lab .pl-listening { font-size:12px; color:#526779; }
  .process-lab .pl-readout { padding:8px 10px; background:#eaf1f5; border-radius:8px; margin:10px 0; }
  @media(max-width:700px) { .process-lab .ci-controls { grid-template-columns:1fr; } .process-lab .ci-control { display:block; } }
</style>
<script>
window.ProcessLab = (() => {
  "use strict";
  const palette=["#b45f06","#2563a6","#8b4db7","#087e85","#b73b63","#697723","#526779","#9c4e88"];
  const symbols={
    mixer:'<circle class="pl-body" r="28"/><path class="pl-symbol" d="M-12 -12 L12 12 M-12 12 L12 -12"/>',
    oscillator:'<circle class="pl-body" r="28"/><path class="pl-symbol" d="M-20 0 Q-10 -22 0 0 T20 0"/>',
    diode:'<path class="pl-symbol" d="M-32 0 H-13 M-13 -17 L14 0 L-13 17 Z M14 -18 V18 M14 0 H32"/>',
    rc:'<path class="pl-symbol" d="M-35 0 H-19 L-15 -8 L-7 8 L1 -8 L9 8 L13 0 H35 M24 0 V13 M14 13 H34 M14 19 H34 M24 19 V27 M15 27 H33"/>',
    lpf:'<path class="pl-symbol" d="M-29 9 H-3 Q8 9 14 21 H28"/><text y="-9">LPF</text>',
    bpf:'<path class="pl-symbol" d="M-29 20 H-18 L-10 8 H10 L18 20 H29"/><text y="-9">BPF</text>',
    rf:'<path class="pl-symbol" d="M-27 22 L-7 10 L-27 -2 Z"/><text x="17" y="21">BPF</text><text y="-13">RF</text>',
    dc:'<path class="pl-symbol" d="M-25 15 H25 M-25 23 L25 2"/><text y="-8">DC</text>',
    derivative:'<path class="pl-symbol" d="M-26 20 H-18 L18 4 H27"/>',
    envelope:'<path class="pl-symbol" d="M-30 19 Q0 -28 30 19 M-30 19 L-24 13 L-18 19 L-12 -1 L-6 19 L0 -6 L6 19 L12 -1 L18 19 L24 13 L30 19"/>',
    sampler:'<path class="pl-symbol" d="M-30 8 H-12 L12 -9 M12 8 H30 M-15 -20 H-6 V-29 H6 V-20 H15"/>',
    reconstruct:'<path class="pl-symbol" d="M-29 11 H-17 V-1 H-4 V-11 H9 V1 H22 V11 H29 M-29 17 Q0 -35 29 17"/>',
    matched:'<path class="pl-symbol" d="M-28 20 H-17 V-3 H-2 V20 H28"/><text y="-13">MF</text>',
    threshold:'<path class="pl-symbol" d="M-29 17 H-3 V-5 H29 M-26 5 H27"/>',
    noise:'<path class="pl-symbol" d="M-27 15 L-18 4 L-9 21 L0 -3 L9 12 L18 -1 L27 15"/><text y="-13">+ n</text>',
    phase:''
  };
  function mount(id,config) {
    CourseInteractives.mount(id,{initial:{position:0,...config.initial},setup(c){
      const m=window.ProcessModels,s=c.state,root=c.root;
      root.classList.add("process-lab");
      const info={};Object.entries(config.signals).forEach(([key,v],i)=>{info[key]={color:palette[i%palette.length],...v};});
      const colorize=(el,key)=>{el.style.setProperty("--signal",info[key].color);el.style.setProperty("--tint",info[key].color+"15");};
      let data=config.model(s),selected=config.initial.selection||config.stages[0].key,hidden=new Set(),cache={},audioContext,source,finishTimer,audioVersion=0,sequenceTimers=[];
      const controls=root.querySelector(".ci-controls"),presets=root.querySelector(".ci-buttons"),plots=root.querySelector(".ci-plots");
      config.controls(c);
      if(config.window!==160)c.control("position","תחילת חלון הזמן",String.raw`t_0\;[\mathrm{ms}]`,0,140,5,0);
      for(const [name,values] of config.presets||[])c.preset(name,values);
      const parameters=c.node("details",null,undefined,"pl-parameters");c.node("summary",parameters,"בחירת אות ופרמטרים");parameters.append(controls,presets);
      const instruction=c.node("p",null,"לחצו על רכיב להשוואת הכניסה והמוצא, או על נקודה לבדיקת האות במקום זה.","ci-note");
      const diagram=c.node("div",null,undefined,"pl-diagram"),canvas=c.node("div",diagram,undefined,"pl-canvas");
      const description=c.node("p",null,undefined,"pl-description"),equation=c.node("div",null,undefined,"pl-equation"),legend=c.node("div",null,undefined,"pl-legend");
      const audio=c.node("div",null,undefined,"pl-audio"),audioStatus=c.node("span",audio,"","pl-listening");
      const readout=config.readout?c.node("p",null,undefined,"pl-readout"):null;
      const stageByKey=Object.fromEntries(config.stages.map(v=>[v.key,v]));
      const active=()=>stageByKey[selected]||{input:null,output:selected,note:info[selected].note,equation:info[selected].equation};
      const visible=key=>key&&!hidden.has(key);
      const duration=config.window||20,limit=config.limit||5.5;
      const time=c.board("time",String.raw`t`,config.window===160?String.raw`t\;[\mathrm{ms}]`:String.raw`t-t_0\;[\mathrm{ms}]`,[-duration*.09,2.2,duration*1.04,-2.2],{height:220});
      const frequency=c.board("frequency",String.raw`\nu`,String.raw`\nu\;[\mathrm{kHz}]`,[-limit*1.08,config.frequencyTop||1.8,limit*1.08,-(config.frequencyTop||1.8)*.12],{height:220});
      for(const [index,title] of ["בזמן","בתדר"].entries()){const h=plots.children[index].querySelector("h5");h.replaceChildren();c.node("span",h,title);}
      const filter=CourseInteractives.filterOverlay(c,frequency,()=>{
        const reference=config.frequencyReference?.(s,selected);
        if(reference)return {color:info[reference.signal].color,...reference};
        const current=stageByKey[selected];
        if(!current)return null;
        const definition=typeof current.filter==="function"?current.filter(s):current.filter || (current.symbol==="dc"?{edges:[0],note:"הקו המקווקו מסמן את רכיב האפס שמסולק.",tex:String.raw`H(0)=0`}:null);
        return definition?{color:info[current.output].color,...definition}:null;
      });
      const curves={};
      for(const side of ["input","output"]){
        const attributes={visible:()=>Boolean(visible(active()[side])),strokeWidth:side==="input"?2:2.5};
        const t=c.sampled(time,()=>cache[side]?.time||{x:[],y:[]},palette[0],{...attributes,visible:()=>Boolean(visible(active()[side]))&&!data[active()[side]]?.discrete});
        const f=c.sampled(frequency,()=>cache[side]?.frequency||{x:[],y:[]},palette[0],attributes);
        const points=Array.from({length:82},(_,i)=>c.point(time,()=>cache[side]?.time.x[i]??0,()=>cache[side]?.time.y[i]??0,palette[0],{size:2,visible:()=>Boolean(visible(active()[side]))&&Boolean(data[active()[side]]?.discrete)&&i<(cache[side]?.time.x.length||0)}));
        curves[side]={t,f,points};
      }
      if(config.thresholdSignal){
        const showThreshold=()=>Object.values(active()).includes(config.thresholdSignal)&&visible(config.thresholdSignal);
        c.segment(time,[0,()=>s.threshold],[duration,()=>s.threshold],{strokeColor:"#526779",visible:showThreshold});
        c.label(time,duration*.12,()=>s.threshold+.18,String.raw`\gamma`,{strokeColor:"#526779",visible:showThreshold});
      }
      const legendButtons={};
      for(const side of ["input","output"]){const button=c.node("button",legend);button.type="button";button.addEventListener("click",()=>{const key=active()[side];hidden.has(key)?hidden.delete(key):hidden.add(key);c.update("visibility");});legendButtons[side]=button;}
      const stop=()=>{audioVersion++;sequenceTimers.forEach(clearTimeout);sequenceTimers=[];if(source){source.onended=null;source.stop();source.disconnect();source=null;}clearTimeout(finishTimer);audioStatus.textContent="";};
      async function play(side){
        stop();const key=side==="original"?config.original:active()[side];if(!key)return;
        const version=audioVersion;
        try{
          const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)throw new Error("Audio unavailable");
          audioContext=audioContext||new Audio();await audioContext.resume();if(version!==audioVersion)return;
          const sequence=config.audioSequence;
          const frames=sequence?Array.from({length:sequence.count},(_,digit)=>config.model({...s,[sequence.control]:digit})):[data];
          const seconds=sequence?sequence.count*(sequence.tone+sequence.gap)-sequence.gap:2;
          const buffer=audioContext.createBuffer(1,Math.round(audioContext.sampleRate*seconds),audioContext.sampleRate),values=buffer.getChannelData(0),signal=data[key];
          if(sequence)values.set(m.sequenceAudio(frames,key,s.position,audioContext.sampleRate,sequence));
          else for(let i=0;i<values.length;i++){const t=i/audioContext.sampleRate+s.position/1000;values[i]=.12*m.valueAt(signal,Math.floor(t*signal.rate))*Math.min(1,i/400,(values.length-1-i)/400);}
          source=audioContext.createBufferSource();source.buffer=buffer;source.connect(audioContext.destination);source.start();source.onended=()=>{source=null;audioStatus.textContent="";};
          audioStatus.textContent="מנגן: "+info[key].name+(signal.discrete?" (בהחזקה מסדר אפס)":"");
          if(sequence){
            const showDigit=digit=>{if(version!==audioVersion)return;s[sequence.control]=digit;c.update("sequence-step");};
            showDigit(0);
            for(let digit=1;digit<sequence.count;digit++)sequenceTimers.push(setTimeout(()=>showDigit(digit),digit*(sequence.tone+sequence.gap)*1000));
          }
          finishTimer=setTimeout(()=>{audioStatus.textContent="";},seconds*1000+200);
        }catch(error){audioStatus.textContent="לא ניתן להפעיל שמע בדפדפן זה.";}
      }
      const playInput=c.node("button",audio,"האזנה לכניסה"),playOutput=c.node("button",audio,"האזנה למוצא"),stopButton=c.node("button",audio,"עצירה");
      playInput.type=playOutput.type=stopButton.type="button";
      playInput.addEventListener("click",()=>play("input"));playOutput.addEventListener("click",()=>play("output"));stopButton.addEventListener("click",stop);
      if(config.original){const original=c.node("button",audio,"האזנה למידע המקורי");original.type="button";original.addEventListener("click",()=>play("original"));}
      audio.append(audioStatus);audio.hidden=config.audio===false;
      document.addEventListener("visibilitychange",()=>{if(document.hidden)stop();});
      const width=config.diagram?.width||1040,height=config.diagram?.height||270;
      let markup="",labels=[];
      const line=(path,key)=>{markup+=`<path class="pl-wire" d="${path}" stroke="${info[key].color}" marker-end="url(#${id}-arrow)"/>`;};
      const label=(x,y,key,tex)=>labels.push({x,y,key,tex:tex||info[key].symbol});
      function part(key,x,y,symbol,signalKey,title){
        const mathSymbol={derivative:String.raw`\frac{1}{\omega_0}\frac{d}{dt}`,threshold:String.raw`>\gamma`,phase:String.raw`+\frac{\pi}{2}`}[symbol];
        if(mathSymbol)label(x,y+(symbol==="threshold"?-17:symbol==="phase"?0:-9),signalKey,mathSymbol);
        const circle=["mixer","oscillator"].includes(symbol);
        markup+=`<g class="pl-part" data-view="${key}" role="button" tabindex="0" aria-label="${title}" transform="translate(${x} ${y})" style="--signal:${info[signalKey].color};--tint:${info[signalKey].color}15"><rect width="108" height="82" x="-54" y="-41" fill="transparent"/>${circle?"":'<rect class="pl-body" x="-47" y="-32" width="94" height="64" rx="4"/>'}${symbols[symbol]||""}</g>`;
      }
      function probe(key,x,y){markup+=`<g class="pl-part pl-probe" data-view="${key}" role="button" tabindex="0" aria-label="${info[key].name}" style="--signal:${info[key].color};--tint:${info[key].color}15"><circle cx="${x}" cy="${y}" r="17" fill="transparent"/><circle class="pl-body" cx="${x}" cy="${y}" r="6"/></g>`;label(x,y+40,key);}
      if(config.diagram?.draw){config.diagram.draw({line,label,part,probe});}
      else{
        const count=config.stages.length,gap=(width-200)/(count-1||1),xs=config.stages.map((_,i)=>count===1?width/2:100+i*gap),y=80;
        config.stages.forEach((stage,i)=>{
          const x=xs[i],previous=i?xs[i-1]+48:15;
          line(`M${previous} ${y} H${x-48}`,stage.input);probe(stage.input,i?(previous+x-48)/2:30,y);
          part(stage.key,x,y,stage.symbol,stage.output,stage.name);
          if(stage.aux){const ay=210;line(`M${x} ${ay-28} V${y+29}`,stage.aux);part(stage.aux,x,ay,"oscillator",stage.aux,info[stage.aux].name);label(x+65,160,stage.aux);label(x,252,stage.aux,String.raw`\mathrm{VCO/LO}`);}
        });
        const last=config.stages.at(-1);line(`M${xs.at(-1)+48} ${y} H${width-15}`,last.output);probe(last.output,width-35,y);
      }
      canvas.innerHTML=`<svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="${config.diagramLabel}"><defs><marker id="${id}-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#526779"/></marker></defs>${markup}</svg>`;
      for(const {x,y,key,tex} of labels){const node=c.node("span",canvas,undefined,"pl-label");node.style.left=x/width*100+"%";node.style.top=y/height*100+"%";node.style.color=info[key].color;c.math(node,tex);}
      for(const element of diagram.querySelectorAll("[data-view]")){
        const select=()=>{selected=element.dataset.view;c.update("selection");};
        element.addEventListener("click",select);element.addEventListener("keydown",event=>{if(["Enter"," "].includes(event.key)){event.preventDefault();select();}});
      }
      let equationRevision=0,typesetting=Promise.resolve();
      const renderEquation=()=>{
        const version=++equationRevision;
        typesetting=typesetting.then(async()=>{
          if(version!==equationRevision)return;
          window.MathJax.typesetClear([equation]);equation.replaceChildren();
          const formula=active().equation,rows=typeof formula==="function"?formula(s):formula;
          for(const row of (Array.isArray(rows)?rows:[[rows]])){const line=c.node("div",equation,undefined,"pl-row");for(const tex of Array.isArray(row)?row:[row])if(tex)c.math(c.node("span",line),tex);}
          await window.MathJax.typesetPromise([equation]);
        }).catch(error=>console.error("Process equation",error));
      };
      for(const element of [instruction,diagram,description,equation,readout,legend,audio,parameters])if(element)root.insertBefore(element,plots);
      c.note("הספקטרום מציג חלון Hann של אותו קטע זמן, מחולק בשטח החלון ובסקלה קבועה. הרחבת הקווים נובעת מהחלון; גובה האותות אינו מנורמל בנפרד.");
      if(config.note)c.note(config.note);
      return {update(key){
        if(!["visibility","selection"].includes(key)){data=config.model(s);}
        if(key!=="visibility"&&key!=="sequence-step")stop();
        if(key!=="visibility"){
          cache={};for(const side of ["input","output"]){const name=active()[side];if(name){cache[side]={time:m.timeData(data[name],s.position,duration),frequency:m.spectrum(data[name],s.position,duration,limit)};}}
          renderEquation();
        }
        filter.update();
        const current=active();description.textContent=(stageByKey[selected]?stageByKey[selected].name+": ":"")+(typeof current.note==="function"?current.note(s):current.note||"");
        if(readout)readout.textContent=config.readout(data,s);
        diagram.querySelectorAll("[data-view]").forEach(el=>el.setAttribute("aria-pressed",String(el.dataset.view===selected)));
        for(const side of ["input","output"]){const name=current[side],button=legendButtons[side];button.hidden=!name;if(!name)continue;
          colorize(button,name);button.textContent=(current.input?(side==="input"?"כניסה: ":"מוצא: "):"אות: ")+info[name].name;button.setAttribute("aria-pressed",String(visible(name)));
          curves[side].t.setAttribute({strokeColor:info[name].color});curves[side].f.setAttribute({strokeColor:info[name].color});curves[side].points.forEach(p=>p.setAttribute({strokeColor:info[name].color,fillColor:info[name].color}));
        }
        playInput.hidden=!current.input;playOutput.textContent=current.input?"האזנה למוצא":"האזנה לאות";
      }};
    }});
  }
  return {mount};
})();
</script>
