<section id="heterodyne-process" class="course-interactive" aria-labelledby="heterodyne-process-title">
  <h4 id="heterodyne-process-title">מכוונים תחנה: מקלט הטרודיין</h4>
  <p class="ci-status" role="status">טוענים את המקלט…</p>
  <noscript>ההדגמה דורשת JavaScript.</noscript>
</section>
<script>
ProcessLab.mount("heterodyne-process",{
  initial:{lo:1200,width:450,selection:"if"},model:ProcessModels.heterodyne,limit:6.5,
  diagramLabel:"מקלט הטרודיין: RF, מיקסר עם VCO, מסנן תדר ביניים, גילוי מעטפת והסרת רכיב קבוע",
  controls(c){c.control("lo","תדר המתנד המקומי",String.raw`f_{\mathrm{LO}}\;[\mathrm{Hz}]`,1000,2400,50,0);c.control("width","חצי רוחב מסנן הביניים",String.raw`B\;[\mathrm{Hz}]`,100,650,25,0);},
  presets:[["התחנה הראשונה",{lo:1200,width:450}],["התחנה השנייה",{lo:2200,width:450}],["בין תחנות",{lo:1700,width:200}],["מסנן צר מדי",{lo:1200,width:100}]],
  signals:{
    received:{name:"שתי תחנות בכניסה",symbol:String.raw`r(t)`,equation:String.raw`r(t)=A_1(t)\cos(\omega_1t)+A_2(t)\cos(\omega_2t)`,note:"שתי תחנות בתדרים 2.4 ו־3.4 kHz. בראשונה צליל 250 Hz, ובשנייה 375 Hz."},
    rf:{name:"מוצא חזית RF",symbol:String.raw`r_{\mathrm{RF}}(t)`,equation:String.raw`r_{\mathrm{RF}}(t)=r(t)`,note:"חזית RF אידאלית בהגבר יחידה מעבירה את שתי התחנות; הברירה הצרה תיעשה ב־IF."},
    mixed:{name:"מוצא המיקסר",symbol:String.raw`u(t)`,equation:[[String.raw`u(t)=\frac{1}{2}\sum_{j=1}^{2}A_j(t)\cos((\omega_j-\omega_{\mathrm{LO}})t)`],[String.raw`+\frac{1}{2}\sum_{j=1}^{2}A_j(t)\cos((\omega_j+\omega_{\mathrm{LO}})t)`]],note:"כל תחנה יוצרת עותק בתדר ההפרש ועותק בתדר הסכום. שני העותקים מופיעים גם בתדרים שליליים."},
    intermediate:{name:"מוצא מסנן IF",symbol:String.raw`v(t)`,equation:[[String.raw`v(t)=\operatorname{BPF}_{\omega_{\mathrm{IF}}}\{u(t)\}`],[String.raw`u(t)=\frac{1}{2}\sum_j A_j(t)\cos((\omega_j-\omega_{\mathrm{LO}})t)`],[String.raw`+\frac{1}{2}\sum_j A_j(t)\cos((\omega_j+\omega_{\mathrm{LO}})t)`]],note:"מרכז המסנן קבוע: 1.2 kHz. המתנד מזיז את התחנות ביחס למסנן; הוא אינו מזיז את המסנן."},
    detected:{name:"המעטפת ב־IF",symbol:String.raw`e(t)`,equation:[[String.raw`e(t)=|v(t)+i\mathcal H\{v(t)\}|`],[String.raw`=\frac{A_j(t)}{2}\quad\text{for one fully passed station}`]],note:"גלאי מעטפת אידאלי באמצעות האות האנליטי. זו אינה סימולציה של מעגל דיודה ו־RC."},
    recovered:{name:"המידע לאחר הסרת DC",symbol:String.raw`y(t)`,equation:[[String.raw`y(t)=e(t)-\langle e\rangle`],[String.raw`=\frac{A_j(t)-\langle A_j\rangle}{2}\quad\text{for one fully passed station}`]],note:"ניתן לשמוע איזה צליל שרד. חיתוך פסי הצד או העברת שתי תחנות יחד משנים את צורת המידע."},
    oscillator:{name:"המתנד המקומי",symbol:String.raw`v_{\mathrm{LO}}(t)`,equation:String.raw`v_{\mathrm{LO}}(t)=\cos(2\pi f_{\mathrm{LO}}t)`,note:"כיוון תדר המתנד בוחר איזו תחנה תגיע לתדר הביניים הקבוע."}
  },
  stages:[
    {key:"rf-block",name:"חזית RF רחבת סרט",symbol:"rf",input:"received",output:"rf",equation:String.raw`r_{\mathrm{RF}}(t)=r(t)=\sum_{j=1}^{2}A_j(t)\cos(\omega_jt)`,note:"מודל בהגבר יחידה שמעביר את שתי התחנות. כאן אין סינון של תחנת דמות או רעש נוסף."},
    {key:"mix",name:"הזזה בתדר",symbol:"mixer",input:"rf",output:"mixed",aux:"oscillator",equation:[[String.raw`u(t)=\frac{1}{2}\sum_{j=1}^{2}A_j(t)\cos((\omega_j-\omega_{\mathrm{LO}})t)`],[String.raw`+\frac{1}{2}\sum_{j=1}^{2}A_j(t)\cos((\omega_j+\omega_{\mathrm{LO}})t)`]],note:"כפל בקוסינוס יוצר את תדרי הסכום וההפרש. שימו לב להגבר חצי, שנשמר גם בגרפים."},
    {key:"if",name:"מסנן IF קבוע",symbol:"bpf",input:"mixed",output:"intermediate",equation:[[String.raw`\tilde V(\omega)=H_{\mathrm{IF}}(\omega)\tilde U(\omega)`],[String.raw`H_{\mathrm{IF}}(\omega)=\mathbf 1_{\{||\omega|-\omega_{\mathrm{IF}}|\le2\pi B\}}`],[String.raw`v(t)=\frac{A_j(t)}{2}`,String.raw`\cos((\omega_j-\omega_{\mathrm{LO}})t)`]],note:"המסנן מעביר תחומים סימטריים סביב ±1.2 kHz. נוסחת המוצא המפושטת תקפה רק כאשר תחנה אחת עוברת במלואה. מסנן צר מדי חותך את פסי הצד; כיוון שגוי מחליש או מסלק את התחנה."},
    {key:"env",name:"גילוי מעטפת אידאלי",symbol:"envelope",input:"intermediate",output:"detected",equation:[[String.raw`e(t)=|v(t)+i\mathcal H\{v(t)\}|`],[String.raw`=\frac{A_j(t)}{2}\quad\text{for one fully passed station}`]],note:"כאשר רק תחנה שלמה אחת עוברת, המעטפת שווה לחצי מהמעטפת המקורית. אחרת הגלאי פועל על האות המסונן בפועל."},
    {key:"dc-block",name:"הסרת רכיב קבוע",symbol:"dc",input:"detected",output:"recovered",equation:[[String.raw`y(t)=e(t)-\langle e\rangle`],[String.raw`=\frac{A_j(t)-\langle A_j\rangle}{2}\quad\text{for one fully passed station}`]],note:"המוצא נשאר בהגבר הפיזיקלי של השרשרת. עברו בין שתי התחנות ושמעו את החלפת הצליל."}
  ],
  note:"למעטפת התחנה הראשונה היסט 1 וצליל במשרעת 0.6; לשנייה היסט 0.4 וצליל במשרעת 0.2. כל המסננים אידאליים. תדרי ההדגמה הונמכו לתחום השמע."
});
</script>
