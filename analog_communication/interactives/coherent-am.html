<script>
// Exact line spectra of real, periodic signals. Coefficients use exp(i*2*pi*f*t).
// The ideal low-pass filter acts on these same coefficients for plots and sound.
window.CoherentAM = (() => {
  const carrier=2400, depth=0.7;
  const messages={melody:[],tone:[[220,1]],two:[[220,0.6],[330,0.4]],chord:[[220,0.4],[275,0.3],[330,0.3]]};
  // Fourier transform of a centered Hann window, normalized by its area.
  function hannResponse(x) {
    if(Math.abs(x)<1e-8)return 1;
    if(Math.abs(Math.abs(x)-1)<1e-8)return 0.5;
    return Math.sin(Math.PI*x)/(Math.PI*x*(1-x*x));
  }
  function combine(terms) {
    const bins=new Map();
    for(const {f,re,im} of terms){const c=bins.get(f)||{f,re:0,im:0};c.re+=re;c.im+=im;bins.set(f,c);}
    return [...bins.values()].filter(c=>Math.hypot(c.re,c.im)>1e-12).sort((a,b)=>a.f-b.f);
  }
  function multiplyCos(terms,frequency,phase=0) {
    const result=[];
    for(const c of terms)for(const sign of [-1,1]) {
      const re=Math.cos(phase)/2,im=sign*Math.sin(phase)/2;
      result.push({f:c.f+sign*frequency,re:c.re*re-c.im*im,im:c.re*im+c.im*re});
    }
    return combine(result);
  }
  function chain({message="tone",phase=0,offset=0,cutoff=600}={}) {
    const original=message==="melody"?melody:messages[message].flatMap(([f,a])=>[{f,re:a/2,im:0},{f:-f,re:a/2,im:0}]);
    const envelope=[{f:0,re:1,im:0},...original.map(c=>({...c,re:c.re*depth,im:c.im*depth}))];
    const received=multiplyCos(envelope,carrier);
    const mixed=multiplyCos(received,carrier+offset,phase*Math.PI/180);
    const filtered=mixed.filter(c=>Math.abs(c.f)<=cutoff);
    const recovered=filtered.filter(c=>c.f!==0);
    const oscillator=multiplyCos([{f:0,re:1,im:0}],carrier+offset,phase*Math.PI/180);
    return {original,received,rfout:received,mixed,filtered,recovered,oscillator};
  }
  const at=(terms,t)=>terms.reduce((sum,c)=>sum+c.re*Math.cos(2*Math.PI*c.f*t)-c.im*Math.sin(2*Math.PI*c.f*t),0);
  const spectrum=terms=>terms.filter(c=>c.f>=0).map(c=>({f:c.f,amplitude:Math.hypot(c.re,c.im)*(c.f===0?1:2)}));
  // Four softly gated notes, periodically repeated every two seconds.
  // Truncating the gate at 16 harmonics keeps plots, filtering and audio identical.
  const melody=combine([220,275,330,275].flatMap((pitch,index)=>{
    const result=[],center=index*0.5+0.25;
    for(let n=-16;n<=16;n++){
      const amplitude=0.125*hannResponse(n*0.25),angle=-2*Math.PI*n*center/2;
      for(const sign of [-1,1])result.push({f:n/2+sign*pitch,re:amplitude*Math.cos(angle)/2,im:amplitude*Math.sin(angle)/2});
    }
    return result;
  }));
  function series(terms,start,step,count) {
    const y=new Float32Array(count);
    for(const c of terms){
      const angle=2*Math.PI*c.f*start,delta=2*Math.PI*c.f*step,cd=Math.cos(delta),sd=Math.sin(delta);
      let re=c.re*Math.cos(angle)-c.im*Math.sin(angle),im=c.re*Math.sin(angle)+c.im*Math.cos(angle);
      for(let i=0;i<count;i++){y[i]+=re;const next=re*cd-im*sd;im=re*sd+im*cd;re=next;}
    }
    return y;
  }
  function windowedSpectrum(terms,start,duration=0.02) {
    const center=start+duration/2;
    const phased=terms.map(c=>{const a=2*Math.PI*c.f*center;return {f:c.f,re:c.re*Math.cos(a)-c.im*Math.sin(a),im:c.re*Math.sin(a)+c.im*Math.cos(a)};});
    const positive=Array.from({length:2201},(_,i)=>i*2.5),positiveY=positive.map(f=>{
      let re=0,im=0;
      for(const c of phased){const w=hannResponse((f-c.f)*duration);re+=c.re*w;im+=c.im*w;}
      return Math.hypot(re,im);
    });
    // All pipeline signals are real: the negative-frequency magnitude is its mirror.
    const x=[...positive.slice(1).reverse().map(f=>-f),...positive];
    const y=[...positiveY.slice(1).reverse(),...positiveY];
    return {x:x.map(f=>f/1000),y};
  }
  return {carrier,depth,messages,chain,at,spectrum,series,windowedSpectrum,hannResponse};
})();
</script>
<script>
CourseInteractives.mount("coherent-am",{
  initial:{message:"melody",phase:0,offset:0,cutoff:600,position:250,selection:"dc"},
  setup(c) {
    const {state:s,colors:k}=c, model=window.CoherentAM;
    const signalInfo={
      original:{name:"אות המידע",color:"#526779"},
      received:{name:"האות הנקלט",color:"#b45f06"},
      rfout:{name:"מוצא RF",color:"#2563a6"},
      mixed:{name:"מוצא המיקסר",color:"#8b4db7"},
      filtered:{name:"מוצא המסנן",color:"#087e85"},
      recovered:{name:"האות המשוחזר",color:"#b73b63"},
      oscillator:{name:"המתנד המקומי",color:"#697723"}
    };
    const hiddenSignals=new Set();
    const shown=side=>Boolean(active()[side])&&!hiddenSignals.has(active()[side]);
    function colorSignal(element,key){const color=signalInfo[key].color;element.style.setProperty("--signal-color",color);element.style.setProperty("--signal-tint",color+"15");}
    let signals=model.chain(s),revision=0;
    c.select("message","אות המידע",[["melody","מנגינה קצרה — לה, דו דיאז, מי"],["tone","צליל יחיד — לה"],["two","שני צלילים — לה ומי"],["chord","אקורד לה מז׳ור"]]);
    c.control("phase","שגיאת פאזה במתנד",String.raw`\hat\phi_0-\phi_0\;[{}^\circ]`,0,180,15,0);
    c.control("offset","שגיאת תדר במתנד",String.raw`\Delta f\;[\mathrm{Hz}]`,-40,40,5,0);
    c.control("cutoff","תדר החיתוך",String.raw`f_{\mathrm{cut}}\;[\mathrm{Hz}]`,100,800,10,0);
    c.control("position","תחילת חלון הזמן",String.raw`t_0\;[\mathrm{ms}]`,0,1980,10,0);
    c.preset("סנכרון מלא",{phase:0,offset:0,cutoff:600});
    c.preset("שגיאת פאזה של רבע מחזור",{phase:90,offset:0,cutoff:600});
    c.preset("שגיאת תדר",{phase:0,offset:20,cutoff:600});
    const controlBox=c.root.querySelector(".ci-controls"),presetBox=c.root.querySelector(".ci-buttons");
    const parameters=c.node("details",null,undefined,"am-parameters");
    c.node("summary",parameters,"בחירת אות ופרמטרים");
    c.root.insertBefore(parameters,controlBox);
    parameters.append(controlBox,presetBox);
    const diagram=c.node("div",null,undefined,"am-schematic");
    diagram.innerHTML=`<svg viewBox="0 0 850 275" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="תרשים מקלט קוהרנטי: מסנן RF, מיקסר, מסנן נמוכים והסרת רכיב קבוע; מתנד מקומי מזין את המיקסר">
      <defs><marker id="am-arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526779"/></marker></defs>
      <g marker-end="url(#am-arrowhead)">
        <path class="am-wire" data-signal="received" d="M30 90 H100"/>
        <path class="am-wire" data-signal="rfout" d="M200 90 H280"/>
        <path class="am-wire" data-signal="mixed" d="M340 90 H450"/>
        <path class="am-wire" data-signal="filtered" d="M540 90 H635"/>
        <path class="am-wire" data-signal="recovered" d="M725 90 H820"/>
        <path class="am-wire" data-signal="oscillator" d="M310 190 V120"/>
      </g>
      <g class="am-component" data-view="rf" role="button" tabindex="0" aria-label="מסנן ומגבר RF אידאלי">
        <rect class="am-body" x="100" y="55" width="100" height="70" rx="4"/>
        <text x="150" y="83">RF</text><path class="am-symbol" d="M130 108 L153 96 L130 84 Z"/><text x="176" y="108">BPF</text>
      </g>
      <g class="am-component" data-view="mixer" role="button" tabindex="0" aria-label="מיקסר">
        <circle class="am-hit" cx="310" cy="90" r="38"/><circle class="am-body" cx="310" cy="90" r="30"/>
        <path class="am-symbol" d="M297 77 L323 103 M297 103 L323 77"/><text x="310" y="39">Mixer</text>
      </g>
      <g class="am-component" data-view="lpf" role="button" tabindex="0" aria-label="מסנן מעביר נמוכים">
        <rect class="am-body" x="450" y="55" width="90" height="70" rx="4"/><text x="495" y="79">LPF</text>
        <path class="am-symbol" d="M469 103 H494 Q503 103 509 114 H523"/>
      </g>
      <g class="am-component" data-view="dc" role="button" tabindex="0" aria-label="הסרת רכיב קבוע">
        <rect class="am-body" x="635" y="55" width="90" height="70" rx="4"/><text x="680" y="84">DC</text>
        <path class="am-symbol" d="M657 109 H703 M657 117 L703 99"/>
      </g>
      <g class="am-component" data-view="oscillator" role="button" tabindex="0" aria-label="מתנד מקומי VCO">
        <circle class="am-hit" cx="310" cy="220" r="38"/><circle class="am-body" cx="310" cy="220" r="30"/>
        <path class="am-symbol" d="M289 220 Q299 199 310 220 T331 220"/><text x="310" y="267">VCO / LO</text>
      </g>
      <g class="am-component am-probe" data-view="received" role="button" tabindex="0" aria-label="האות הנקלט לפני RF"><circle class="am-hit" cx="60" cy="90" r="22"/><circle class="am-body" cx="60" cy="90" r="7"/></g>
      <g class="am-component am-probe" data-view="rfout" role="button" tabindex="0" aria-label="האות לפני המיקסר"><circle class="am-hit" cx="238" cy="90" r="22"/><circle class="am-body" cx="238" cy="90" r="7"/></g>
      <g class="am-component am-probe" data-view="mixed" role="button" tabindex="0" aria-label="האות אחרי המיקסר"><circle class="am-hit" cx="390" cy="90" r="22"/><circle class="am-body" cx="390" cy="90" r="7"/></g>
      <g class="am-component am-probe" data-view="filtered" role="button" tabindex="0" aria-label="האות אחרי המסנן"><circle class="am-hit" cx="585" cy="90" r="22"/><circle class="am-body" cx="585" cy="90" r="7"/></g>
      <g class="am-component am-probe" data-view="recovered" role="button" tabindex="0" aria-label="אות המוצא"><circle class="am-hit" cx="775" cy="90" r="22"/><circle class="am-body" cx="775" cy="90" r="7"/></g>
    </svg>`;
    const canvas=c.node("div",null,undefined,"am-schematic-canvas");
    canvas.appendChild(diagram.firstElementChild);diagram.appendChild(canvas);
    [[60,133,String.raw`r(t)`,"received"],[238,133,String.raw`r(t)`,"rfout"],[390,133,String.raw`u(t)`,"mixed"],[585,133,String.raw`v(t)`,"filtered"],[775,133,String.raw`y(t)`,"recovered"],[360,167,String.raw`v_{\mathrm{LO}}(t)`,"oscillator"]].forEach(([x,y,tex,key])=>{
      const label=c.math(canvas,tex);label.classList.add("am-wire-label");label.style.left=100*x/850+"%";label.style.top=100*y/275+"%";
      label.style.color=signalInfo[key].color;
    });
    const receivedEquation=[
      [String.raw`r(t)=A(t)\cos(\omega_0t+\phi_0)`],
      [String.raw`A(t)=1+0.7f(t)`]
    ];
    const mixerEquation=[
      [String.raw`u(t)=A(t)`,String.raw`\cos(\omega_0t+\phi_0)`,String.raw`\cos(\omega_{\mathrm{LO}}t+\hat\phi_0)`],
      [String.raw`=\frac{A(t)}{2}\Bigl[`,
        String.raw`\underbrace{\cos\!\left((\omega_0-\omega_{\mathrm{LO}})t+\phi_0-\hat\phi_0\right)}_{\text{Low frequency}}`,
        String.raw`+\underbrace{\cos\!\left((\omega_0+\omega_{\mathrm{LO}})t+\phi_0+\hat\phi_0\right)}_{\text{High frequency}}`,String.raw`\Bigr]`]
    ];
    const passesDifference=()=>s.cutoff>=Math.max(...signals.original.map(term=>Math.abs(term.f)))+Math.abs(s.offset);
    function filteredEquation(){
      const difference=String.raw`\cos\!\left((\omega_0-\omega_{\mathrm{LO}})t+\phi_0-\hat\phi_0\right)`;
      const rows=[[String.raw`v(t)=\mathrm{LPF}\{u(t)\}`]];
      if(passesDifference()){
        rows.push([String.raw`=\frac{A(t)}{2}`,difference]);
        if(s.offset===0)rows.push([String.raw`\omega_{\mathrm{LO}}=\omega_0\;\Longrightarrow`,String.raw`v(t)=\frac{A(t)}{2}\cos(\phi_0-\hat\phi_0)`]);
      }else{
        rows.push([String.raw`=\frac12\,\mathrm{LPF}\Bigl\{`,String.raw`A(t)`,difference,String.raw`\Bigr\}`]);
      }
      return rows;
    }
    const stages=[
      {name:"כפל במתנד מקומי",input:"rfout",output:"mixed",before:"r(t)",after:"u(t)",
        equation:mixerEquation,
        note:"המכפלה מזיזה עותק של האות לסביבת האפס ועותק נוסף לסביבת פעמיים תדר הנושא."},
      {name:"מסנן מעביר נמוכים",input:"mixed",output:"filtered",before:"u(t)",after:"v(t)",
        equation:filteredEquation,
        note:"מסנן אידאלי משאיר רק רכיבי תדר שמתחת לתדר החיתוך. חיתוך נמוך מדי מוחק גם חלק מצלילי המידע."},
      {name:"הסרת רכיב קבוע",input:"filtered",output:"recovered",before:"v(t)",after:"y(t)",
        equation:String.raw`y(t)=v(t)-\langle v\rangle,\qquad\substack{\omega_{\mathrm{LO}}=\omega_0\\ f_{\mathrm{cut}}\geq f_{\max}}\;\Longrightarrow\;y(t)=\frac{0.7}{2}f(t)\cos(\phi_0-\hat\phi_0)`,
        note:"מסירים רק את רכיב האפס. בסנכרון תדר, וכאשר המסנן מעביר את כל המידע, מתקבל האות המקורי כפול הגבר קבוע. שגיאת תדר משאירה פעימות איטיות."}
    ];
    const views={mixer:{...stages[0],stage:0},lpf:{...stages[1],stage:1},dc:{...stages[2],stage:2},
      rf:{name:"מסנן ומגבר RF",input:"received",output:"rfout",equation:[...receivedEquation,[String.raw`H_{\mathrm{RF}}=1`]],note:"במודל הזה חזית ה־RF אידאלית: היא מעבירה את השידור בהגבר יחידה. לחצו על המיקסר כדי לראות את שינוי התדר."},
      oscillator:{name:"המתנד המקומי",output:"oscillator",equation:[[String.raw`v_{\mathrm{LO}}(t)=\cos(\omega_{\mathrm{LO}}t+\hat\phi_0)`],[String.raw`\omega_{\mathrm{LO}}=\omega_0+2\pi\Delta f`]],note:"המתנד המקומי מוזן לכניסה השנייה של המיקסר. הפאזה והתדר שלו קובעים אם המידע ישוחזר."}
    };
    const probes={received:["received","האות הנקלט",receivedEquation],rfout:["rfout","לפני המיקסר",receivedEquation],mixed:["mixed","אחרי המיקסר",mixerEquation],filtered:["filtered","אחרי המסנן",filteredEquation],recovered:["recovered","אות המוצא",String.raw`y(t)=v(t)-\langle v\rangle`]};
    for(const [key,[output,name,equation]] of Object.entries(probes))views[key]={output,name,equation,note:"האות בנקודה שנבחרה מוצג בזמן ובתדר. אפשר להאזין לו או לבחור רכיב להשוואת כניסה ומוצא."};
    views.filtered.note=()=>passesDifference()
      ? "המסנן דוחה את רכיב תדר הסכום ומעביר את כל רכיב תדר ההפרש. כאשר גם התדרים תואמים, נשארת המעטפת כפול מקדם שתלוי בהפרש הפאזות."
      : "המסנן דוחה את תדר הסכום, אך תדר החיתוך הנוכחי חותך גם חלק מרכיב תדר ההפרש. לכן פעולת הסינון נשארת בביטוי המפורש.";
    const active=()=>views[s.selection];
    const components=[...diagram.querySelectorAll("[data-view]")];
    components.forEach(component=>{
      colorSignal(component,views[component.dataset.view].output);
      const select=()=>{s.selection=component.dataset.view;c.update("selection");};
      component.addEventListener("click",select);
      component.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();select();}});
    });
    diagram.querySelectorAll(".am-wire[data-signal]").forEach(wire=>wire.style.stroke=signalInfo[wire.dataset.signal].color);
    const instruction=c.node("p",null,"לחצו על רכיב להשוואת כניסה ומוצא, או על נקודה כדי לבדוק את האות במקום זה.","ci-note");
    const explanation=c.node("p",null,undefined,"am-explanation");explanation.setAttribute("aria-live","polite");
    const equation=c.node("div",null,undefined,"ci-equation am-stage-equation");equation.dir="ltr";
    const legend=c.node("div",null,undefined,"am-legend");
    legend.setAttribute("role","group");legend.setAttribute("aria-label","הצגה והסתרה של אותות בשני הגרפים");
    const beforeLegend=c.node("button",legend),afterLegend=c.node("button",legend);
    [[beforeLegend,"input"],[afterLegend,"output"]].forEach(([button,side])=>{
      button.type="button";button.title="לחצו כדי להציג או להסתיר בשני הגרפים";
      button.addEventListener("click",()=>{const key=active()[side];if(hiddenSignals.has(key))hiddenSignals.delete(key);else hiddenSignals.add(key);c.update("visibility");});
    });
    const plots=c.root.querySelector(".ci-plots");
    for(const element of [instruction,diagram,explanation,equation,legend])c.root.insertBefore(element,plots);
    c.root.insertBefore(parameters,plots);
    const settings={height:190,negativeX:false};
    const time=c.board("time",String.raw`t`,String.raw`\Delta t\;[\mathrm{ms}]`,[-1.7,2,21,-2],settings);
    const frequency=c.board("frequency",String.raw`\nu`,String.raw`\nu\;[\mathrm{kHz}]`,[-5.6,0.7,5.6,-0.1],{...settings,negativeX:true,negativeY:false});
    [...c.root.querySelectorAll(".ci-plot h5")].forEach((title,index)=>{title.textContent=index?"בתדר":"בזמן";});
    const current=side=>signals[active()[side]||active().output];
    let plotCache=new WeakMap();
    function samples(terms){
      const cached=plotCache.get(terms)||{};
      if(!cached.time){const x=Array.from({length:2401},(_,i)=>20*i/2400);cached.time={x,y:Array.from(model.series(terms,s.position/1000,0.02/2400,2401))};plotCache.set(terms,cached);}
      return cached.time;
    }
    function frequencyCurve(terms){
      const cached=plotCache.get(terms)||{};
      if(!cached.frequency){cached.frequency=model.windowedSpectrum(terms,s.position/1000);plotCache.set(terms,cached);}
      return cached.frequency;
    }
    const empty={x:[],y:[]};
    const traces=[];
    for(const side of ["input","output"]){
      traces.push({side,curve:c.sampled(time,()=>shown(side)?samples(current(side)):empty,k.ink,{strokeWidth:side==="input"?1.3:1.6,strokeOpacity:0.85})});
      traces.push({side,curve:c.sampled(frequency,()=>shown(side)?frequencyCurve(current(side)):empty,k.ink,{strokeWidth:side==="input"?2.2:1.4,strokeOpacity:0.85})});
    }
    const filter=CourseInteractives.filterOverlay(c,frequency,()=>{
      const color=signalInfo[active().output].color;
      if(s.selection==="lpf")return {color,bands:[[-s.cutoff/1000,s.cutoff/1000]],edges:[-s.cutoff/1000,s.cutoff/1000],note:"הצללה: תחום המעבר; קווים מקווקווים: תדרי החיתוך.",tex:String.raw`|\nu|\le ${s.cutoff/1000}\;\mathrm{kHz}`};
      if(s.selection==="rf")return {color,allpass:true,note:"הצללה: מעבר בהגבר יחידה בכל התחום המוצג (מודל RF אידאלי).",tex:String.raw`H_{\mathrm{RF}}=1`};
      if(s.selection==="dc")return {color,edges:[0],note:"הקו המקווקו מסמן את הרכיב שמסולק; יתר התדרים עוברים.",tex:String.raw`H(0)=0`};
      return null;
    });
    c.note("בתדר מוצגת משרעת התמרת פורייה בחלון Hann קצר, ולכן מתקבלות פסגות רציפות. אין נרמול נפרד לאותות; הצירים קבועים.");
    c.note("שני הגרפים מחושבים מאותו חלון בתחילת הקטע: ",String.raw`T=20\,\mathrm{ms},\qquad t=t_0+\Delta t`);
    const audioRow=c.node("div",c.root,undefined,"am-audio");audioRow.setAttribute("role","group");audioRow.setAttribute("aria-label","האזנה לאותות");
    let audioContext,source,gainNode,audioRevision=0;
    const audioStatus=c.node("span",null,"","am-audio-status");audioStatus.setAttribute("role","status");
    function stop(){audioRevision++;if(source){source.onended=null;source.stop();source.disconnect();source=null;}if(gainNode){gainNode.disconnect();gainNode=null;}audioStatus.textContent="";}
    async function listen(side,name){
      stop();
      const request=audioRevision;
      try {
        const Audio=window.AudioContext||window.webkitAudioContext;
        if(!Audio)throw new Error("Web Audio unavailable");
        audioContext=audioContext||new Audio();await audioContext.resume();
        if(request!==audioRevision)return;
        const terms=side==="original"?signals.original:current(side),rate=audioContext.sampleRate;
        const buffer=audioContext.createBuffer(1,rate*2,rate);
        buffer.copyToChannel(model.series(terms,s.position/1000,1/rate,rate*2),0);
        source=audioContext.createBufferSource();source.buffer=buffer;gainNode=audioContext.createGain();
        const now=audioContext.currentTime;
        gainNode.gain.setValueAtTime(0,now);gainNode.gain.linearRampToValueAtTime(0.12,now+0.015);
        gainNode.gain.setValueAtTime(0.12,now+1.975);gainNode.gain.linearRampToValueAtTime(0,now+2);
        source.connect(gainNode);gainNode.connect(audioContext.destination);
        source.onended=()=>{source?.disconnect();gainNode?.disconnect();source=null;gainNode=null;audioStatus.textContent="ההאזנה הסתיימה";};
        source.start();audioStatus.textContent="מנגנים: "+name;
      }catch(error){stop();audioStatus.textContent="ההאזנה אינה זמינה בדפדפן זה";console.error(error);}
    }
    const audioButtons={};
    [["האזנה לפני","input"],["האזנה אחרי","output"],["צליל המקור","original"]].forEach(([name,side])=>{const button=c.node("button",audioRow,name);button.type="button";audioButtons[side]=button;button.addEventListener("click",()=>listen(side,side==="original"?name:active().name));});
    const stopButton=c.node("button",audioRow,"עצירה");stopButton.type="button";stopButton.addEventListener("click",stop);audioRow.appendChild(audioStatus);
    c.note("לצורך האזנה נבחר נושא בתחום השמע: ",String.raw`\omega_0=2\pi\cdot2400\;\frac{\mathrm{rad}}{\mathrm{sec}}`);
    c.note("בדוגמה הנקלטת הפאזה ההתחלתית היא אפס; הבקרה משנה את פאזת המתנד: ",String.raw`\phi_0=0,\qquad\hat\phi_0-\phi_0`);
    c.note("נשמעים אותם אותות שמוצגים בגרפים, בהנחתה קבועה; רכיב קבוע אינו נשמע. כל קטע נמשך שתי שניות.");
    document.addEventListener("visibilitychange",()=>{if(document.hidden)stop();});window.addEventListener("pagehide",()=>{stop();audioContext?.close();},{once:true});
    function typesetEquation(){
      const version=++revision;
      Promise.resolve(window.MathJax.startup.promise).then(()=>{
        if(version!==revision)return;
        window.MathJax.typesetClear([equation]);equation.replaceChildren();
        const value=typeof active().equation==="function"?active().equation():active().equation;
        const rows=Array.isArray(value)?value:[value.split(/\\qquad|\\quad/g)];
        rows.forEach(parts=>{
          const row=c.node("div",equation,undefined,"am-formula-row");
          parts.forEach(part=>c.math(row,part).classList.add("am-formula-part"));
        });
        return window.MathJax.typesetPromise([equation]);
      }).catch(console.error);
    }
    return {update(key){
      if(key!=="visibility"){stop();if(key!=="selection")signals=model.chain(s);plotCache=new WeakMap();}
      filter.update();
      components.forEach(component=>component.setAttribute("aria-pressed",String(component.dataset.view===s.selection)));
      explanation.textContent=active().name+": "+(typeof active().note==="function"?active().note():active().note);
      beforeLegend.hidden=!active().input;
      [[beforeLegend,"input"],[afterLegend,"output"]].forEach(([button,side])=>{
        const signal=active()[side];if(!signal)return;
        colorSignal(button,signal);
        button.textContent=(active().input?(side==="input"?"כניסה: ":"מוצא: "):"אות: ")+signalInfo[signal].name;
        button.setAttribute("aria-pressed",String(shown(side)));
      });
      traces.forEach(({curve,side})=>{const signal=active()[side];if(signal)curve.setAttribute({strokeColor:signalInfo[signal].color});});
      audioButtons.input.hidden=!active().input;
      audioButtons.output.textContent=active().input?"האזנה אחרי":"האזנה לאות";
      if(key==="initial"||key==="selection"||(typeof active().equation==="function"&&["cutoff","offset","message","preset"].includes(key)))typesetEquation();
    }};
  }
});
</script>
